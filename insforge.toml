[auth]
allowed_redirect_urls = []
# AUTHZ-001 (audit 2026-09): temporarily disabled - [auth.smtp] is disabled, so
# 6-digit verification codes are undeliverable and mandatory verification
# dead-ends every signup. Re-enable require_email_verification ONLY together
# with [auth.smtp] enabled = true; the CI invariant test enforces this pairing.
require_email_verification = false
verify_email_method = "code"
reset_password_method = "code"
disable_signup = false

[auth.password]
min_length = 10
require_number = false
require_lowercase = false
require_uppercase = false
require_special_char = false

[auth.smtp]
enabled = false
host = ""
port = 465
username = ""
sender_email = ""
sender_name = ""
min_interval_seconds = 60

[storage]
max_file_size_mb = 50

[realtime]
retention_days = 0

[schedules]
retention_days = 7
